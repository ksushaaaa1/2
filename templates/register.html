<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | NEON BEAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 80% 30%, rgba(255, 200, 220, 0.35) 0%, transparent 35%),
                radial-gradient(circle at 20% 70%, rgba(255, 180, 210, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 60% 80%, rgba(255, 220, 235, 0.3) 0%, transparent 30%);
            z-index: 0;
            pointer-events: none;
        }

        .register-container {
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 40px;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255, 184, 210, 0.3);
            position: relative;
            z-index: 2;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 30%, #FFB8D2 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #B0B0B0;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            background-color: #222;
            border: 1px solid rgba(255, 184, 210, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #FFB8D2;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background-color: #FFB8D2;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            background-color: transparent;
            color: #FFB8D2;
            border: 1px solid #FFB8D2;
        }

        .links {
            text-align: center;
            margin-top: 25px;
        }

        .links a {
            color: #FFB8D2;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .flash-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .flash-error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        .flash-success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #51cf66;
        }

        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #B0B0B0;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
            z-index: 3;
        }

        .back-link:hover {
            color: #FFB8D2;
        }
    </style>
</head>
<body>
    <a href="/" class="back-link">← На главную</a>

    <div class="register-container">
        <div class="logo">NEON BEAT</div>
        <h2>Регистрация</h2>
        <p class="subtitle">Создайте аккаунт за 1 минуту</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" name="name" placeholder="Анна" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="hello@neonbeat.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="минимум 8 символов" minlength="8" required>
            </div>
            <button type="submit" class="btn">Создать аккаунт</button>
        </form>

        <div class="links">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </div>
    </div>
</body>
</html>
